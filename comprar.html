<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar - Caneca Devocional</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="comprar.js"></script>
</head>
<body>

<header>
    <h1>Caneca Devocional</h1>
</header>

<div class="container">

    <div class="section">
        <h2>Escolha sua caneca</h2>

        <label for="cor-select">Cor da caneca:</label>
        <select id="cor-select">
            <option value="marrom">Marrom (56 disponíveis)</option>
            <option value="creme">Creme (75 disponíveis)</option>
        </select>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" min="1" value="1">

        <p id="aviso-estoque" class="error-message" style="display:none;">
            Quantidade maior que o estoque disponível.
        </p>
    </div>

    <div class="section">
        <h2>Preço</h2>
        <p>Valor unitário: <strong>R$69,90</strong></p>
        <p id="subtotal">Subtotal: R$69,90</p>
    </div>

    <div class="section">
        <h2>Cupom de Desconto</h2>

        <label for="cupom">Digite seu cupom:</label>
        <input type="text" id="cupom" placeholder="DEVOCIONAL10">

        <button id="aplicar-cupom">Aplicar cupom</button>

        <p id="cupom-msg"></p>
    </div>

    <div class="section">
        <h2>Total</h2>
        <p id="total-final" class="valor-total">R$69,90</p>
    </div>

    <button id="finalizar" class="comprar-btn">Finalizar Pedido</button>

</div>

<footer>
    <p>&copy; 2025 - Um Dedo de Fé</p>
</footer>

</body>
</html>
