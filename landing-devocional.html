<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Começando o Dia com Deus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Fonts + Bootstrap (mesmo padrão do site) -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background-color: #EFE7DF;
      color: #3B2A1A;
    }

    .lp-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 4rem 1rem;
    }

    .lp-image {
      position: relative;
      text-align: center;
    }

    .lp-image img {
      max-width: 100%;
      height: auto;
      position: relative;
      z-index: 2;
    }

    .circle-bg {
      position: absolute;
      width: 360px;
      height: 360px;
      background-color: #9A5B45;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    .lp-title small {
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      background: #3B2A1A;
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 0.5rem;
    }

    .lp-title h1 {
      font-weight: 800;
      font-size: 3rem;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .lp-text {
      font-size: 1.1rem;
      max-width: 520px;
    }

    .lp-author {
      margin-top: 2rem;
      font-size: 0.95rem;
    }

    /* Botão */
    .lp-btn {
      background-color: #B3672A;
      color: #fff;
      border-radius: 40px;
      padding: 0.9rem 2rem;
      font-weight: 700;
      border: none;
      display: inline-block;
      margin-top: 1.5rem;
    }

    .lp-btn:hover {
      background-color: #3B2A1A;
      color: #fff;
    }

    /* RESPONSIVO */
    @media (max-width: 768px) {
      .lp-wrapper {
        text-align: center;
        padding-top: 6rem;
      }

      .circle-bg {
        width: 260px;
        height: 260px;
      }

      .lp-title h1 {
        font-size: 2.2rem;
      }

      .lp-text {
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

<section class="lp-wrapper">
  <div class="container">
    <div class="row align-items-center">

      <!-- IMAGEM -->
      <div class="col-lg-5 mb-4 mb-lg-0 lp-image">
        <div class="circle-bg"></div>
